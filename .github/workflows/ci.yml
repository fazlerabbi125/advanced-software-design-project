name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        # setup-uv publishes exact release tags only (no floating "v10" tag).
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Ruff Lint (major errors only)
        # Fails only on major code errors (syntax errors, undefined variables, logic bugs).
        # Ignores minor issues like unused imports (F401), unused variables (F841),
        # import ordering (I), pyupgrade suggestions (UP), and formatting/whitespace (E, W).
        run: uv run ruff check . --ignore F401,F841,I,UP,E,W

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: bfs_gym_test
          POSTGRES_USER: bfs_gym
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bfs_gym -d bfs_gym_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only settings; nothing here is a real secret.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: bfs_gym_test
      POSTGRES_USER: bfs_gym
      POSTGRES_PASSWORD: ci-only-password
      CACHE_REDIS_URL: redis://127.0.0.1:6379/0
      JWT_ACCESS_SECRET_KEY: ci-access-secret-0123456789abcdef0123456789
      JWT_REFRESH_SECRET_KEY: ci-refresh-secret-0123456789abcdef012345678
      JWT_ISSUER: bfs-gym-api
      JWT_AUDIENCE: bfs-gym-clients
      UPLOAD_ROOT: /tmp/bfs-gym-uploads
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_SUCCESS_URL: https://example.test/checkout/success
      STRIPE_CANCEL_URL: https://example.test/checkout/cancel
      # The database tests create and drop their own schema in this throwaway database.
      BFS_TEST_DATABASE_URL: postgresql+asyncpg://bfs_gym:ci-only-password@127.0.0.1:5432/bfs_gym_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Apply migrations
        # Proves the migration chain runs from an empty database.
        run: uv run alembic upgrade head

      - name: Run unit and database tests
        run: uv run python -m unittest discover -s tests -v

  metrics:
    name: Software metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Cyclomatic complexity (functions rated C or worse)
        # Report only; used to pick refactoring targets. -nc lists ranks C to F.
        run: uvx radon cc app -s -nc --total-average

      - name: Maintainability index per file
        run: uvx radon mi app -s

      - name: Raw size metrics
        run: uvx radon raw app -s
