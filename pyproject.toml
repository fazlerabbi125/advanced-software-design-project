[project]
name = "bfs-gym-api"
version = "0.1.0"
description = "BFS Gym membership and booking API"
readme = "README.md"
requires-python = ">=3.13.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.143.0",
    "pydantic-settings>=2.15.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
