name: bfs-gym

x-environment: &environment
  env_file:
    - .env.docker

services:
  migrate:
    <<: *environment
    build: .
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *environment
    build: .
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000
    ports:
      - 127.0.0.1:${APP_PORT}:8000
    volumes:
      - ./app:/app/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      cache-redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    <<: *environment
    image: postgres:18.6-alpine3.24
    ports:
      - 127.0.0.1:${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache-redis:
    <<: *environment
    image: redis:8.10.2-alpine3.23
    # LRU eviction: occupancy sorted sets and VIP waiting lists expire naturally.
    command: redis-server --save "" --maxmemory ${CACHE_REDIS_MAXMEMORY} --maxmemory-policy allkeys-lru
    ports:
      - 127.0.0.1:${CACHE_REDIS_PORT}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    <<: *environment
    image: dpage/pgadmin4:9.17
    ports:
      - 127.0.0.1:${PGADMIN_PORT}:80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # ── Stripe CLI sidecar (optional, only when testing payments) ──────────────
  # The Stripe CLI creates an outbound connection to Stripe's sandbox servers
  # and forwards incoming webhook events to the API container on the internal
  # Docker network.  The API is NOT exposed publicly — this is safe for local
  # development only.
  #
  # Start with:  docker compose --profile stripe up
  #
  # After startup, copy the "whsec_..." signing secret printed in the logs and
  # set STRIPE_WEBHOOK_SECRET in .env.docker, then restart the api service.
  stripe-listener:
    image: stripe/stripe-cli:latest
    profiles: [stripe]
    command: >
      listen
      --api-key ${STRIPE_SECRET_KEY}
      --forward-to http://api:8000/api/v1/payments/stripe/webhook
    depends_on:
      api:
        condition: service_started

volumes:
  pgadmin_data:
  postgres_data:
  uploads_data:
