name: bfs-gym

x-environment: &environment
  env_file:
    - .env.docker

services:
  migrate:
    <<: *environment
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *environment
    build: .
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CACHE_REDIS_URL: redis://cache-redis:6379/0
      CELERY_BROKER_URL: redis://queue-redis:6379/0
      CELERY_RESULT_BACKEND: redis://queue-redis:6379/1
      UPLOAD_ROOT: /app/uploads
    ports:
      - 127.0.0.1:${APP_PORT}:8000
    volumes:
      - ./app:/app/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      cache-redis:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *environment
    build: .
    command: celery --app=app.queue.celery_app:celery_app worker --loglevel=INFO --queues=${CELERY_DEFAULT_QUEUE}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://queue-redis:6379/0
      CELERY_RESULT_BACKEND: redis://queue-redis:6379/1
    profiles:
      - worker
    volumes:
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    <<: *environment
    image: postgres:18.6-alpine3.24
    ports:
      - 127.0.0.1:${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache-redis:
    <<: *environment
    image: redis:8.10.2-alpine3.23
    command: redis-server --save "" --maxmemory ${CACHE_REDIS_MAXMEMORY} --maxmemory-policy allkeys-lru
    ports:
      - 127.0.0.1:${CACHE_REDIS_PORT}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  queue-redis:
    <<: *environment
    image: redis:8.10.2-alpine3.23
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    ports:
      - 127.0.0.1:${QUEUE_REDIS_PORT}:6379
    volumes:
      - queue_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    <<: *environment
    image: dpage/pgadmin4:9.17
    ports:
      - 127.0.0.1:${PGADMIN_PORT}:80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgadmin_data:
  postgres_data:
  queue_redis_data:
  uploads_data:
