name: bfs-gym-local

x-environment: &environment
  env_file:
    - .env

services:
  cache-redis:
    <<: *environment
    image: redis:8.10.2-alpine3.23
    # LRU eviction: occupancy sorted sets and VIP waiting lists expire naturally.
    command: redis-server --save "" --maxmemory ${CACHE_REDIS_MAXMEMORY} --maxmemory-policy allkeys-lru
    ports:
      - 127.0.0.1:${CACHE_REDIS_PORT}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional local-development webhook listener. The API runs on the host when
  # using this Compose file, so the Stripe CLI forwards through Docker Desktop
  # to the host rather than to the ``api`` service in compose.yml.
  #
  # Start with:
  #   docker compose -f compose.local.yml --profile stripe up -d
  # Then copy the ``whsec_...`` value from this service's logs into .env and
  # restart the host-run FastAPI process.
  stripe-listener:
    image: stripe/stripe-cli:v1.51.0
    profiles: [stripe]
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
    command: >
      listen
      --all-snapshot
      --forward-to http://host.docker.internal:8000/api/v1/payments/stripe/webhook
